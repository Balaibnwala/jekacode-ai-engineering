<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Git fork → PR — Jekacode</title>
  <style>
    :root { --navy:#03045E; --green:#16D365; }
    body { margin:0; font-family:Arial,sans-serif; background:#F4F6FB; }
    header { background:var(--navy); color:#fff; padding:28px 32px; }
    .sub { color:var(--green); font-size:12px; letter-spacing:2px; }
    main { max-width:640px; margin:0 auto; padding:28px 16px; }
    .node { background:#fff; border:2px solid var(--navy); border-radius:14px; padding:16px; text-align:center; margin:8px 0; }
    .you { border-color: var(--green); }
    .v { text-align:center; color:var(--green); font-size:22px; }
  </style>
</head>
<body>
  <header>
    <div class="sub">GUIDE · FORK PUSH PR</div>
    <h1>Your copy, then a request to merge</h1>
  </header>
  <main>
    <div class="node">Jekacode class repo on GitHub</div>
    <div class="v">fork (button)</div>
    <div class="node you">Your fork (your username)</div>
    <div class="v">git clone → laptop → git push</div>
    <div class="node you">projects/YOUR_NAME/ with your work</div>
    <div class="v">Pull Request</div>
    <div class="node">Teacher reviews. Merge or comments.</div>
    <p>Full steps: <code>guides/fork_push_pr.md</code>. Never push <code>.env</code>.</p>
  </main>
</body>
</html>
